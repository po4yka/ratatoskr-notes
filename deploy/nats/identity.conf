# Merge this public-nkey identity into the host NATS `authorization.users` list. The deployed ACL
# is `deploy/nats/ratatoskr.conf` in ratatoskr-platform, and this stanza is a byte-equal copy of its
# NOTES entry (workspace change add-notes-vault-connections, spec fleet-bus-topology). The seed
# stays in `/etc/ratatoskr/notes.nkey`, named by `RATATOSKR__BUS__NKEY_SEED_PATH`; replace only the
# non-secret public-key placeholder.
#
# Notes consumes no durable. It publishes its three event subjects and the shared operation-report
# subject. The report subject is trusted only by its envelope `producer` field: every identity that
# may publish it can forge a report for another producer (spec fleet-bus-topology). A denied
# publish is visible only in the NATS server log as a `Publish Violation`; the client sees a
# missing PubAck.
{
    nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_NOTES_XXXXXXXX
    permissions: {
        publish: {
            allow: [
                "evt.notes.vault.connected.v1",
                "evt.notes.vault.disconnected.v1",
                "evt.notes.file.changed.v1",
                "evt.platform.operation.reported.v1",
            ]
        }
        subscribe: { allow: ["_INBOX_notes.>"] }
    }
}
