# Merge this public-nkey identity into the host NATS `authorization.users` list. The deployed ACL
# is `deploy/nats/ratatoskr.conf` in ratatoskr-platform, and this stanza is a byte-equal copy of its
# NOTES entry (workspace changes add-notes-vault-connections and add-notes-write-back, spec
# fleet-bus-topology). The seed stays in `/etc/ratatoskr/notes.nkey`, named by
# `RATATOSKR__BUS__NKEY_SEED_PATH`; replace only the non-secret public-key placeholder.
#
# Notes consumes one durable, `ratatoskr_notes_write_requests` on `ratatoskr_commands`, which Edge
# creates: it may read the durable's info, pull its next messages and acknowledge them, and it
# cannot create a consumer. It publishes its three file and vault event subjects, the two conflict
# events and the shared operation-report subject, and no command. The report subject is trusted
# only by its envelope `producer` field: every identity that may publish it can forge a report for
# another producer (spec fleet-bus-topology). A denied publish is visible only in the NATS server
# log as a `Publish Violation`; the client sees a missing PubAck.
{
    nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_NOTES_XXXXXXXX
    permissions: {
        publish: {
            allow: [
                "evt.notes.vault.connected.v1",
                "evt.notes.vault.disconnected.v1",
                "evt.notes.file.changed.v1",
                "evt.notes.conflict.raised.v1",
                "evt.notes.conflict.resolved.v1",
                "evt.platform.operation.reported.v1",
                "$JS.API.CONSUMER.INFO.ratatoskr_commands.ratatoskr_notes_write_requests",
                "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_commands.ratatoskr_notes_write_requests",
                "$JS.ACK.ratatoskr_commands.ratatoskr_notes_write_requests.>",
            ]
        }
        subscribe: { allow: ["_INBOX_notes.>"] }
    }
}
