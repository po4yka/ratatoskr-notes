[package]
name        = "ratatoskr-notes"
description = "The Ratatoskr Notes deployable: connected Obsidian vaults, their files and their index."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[[bin]]
name = "ratatoskr-notes"
path = "src/main.rs"

[dependencies]
ratatoskr-error-contracts.workspace   = true
ratatoskr-event-envelope.workspace    = true
ratatoskr-identifiers.workspace       = true
ratatoskr-notes-contracts.workspace   = true
ratatoskr-notes-persistence.workspace = true
axum.workspace                        = true
chacha20poly1305.workspace            = true
figment.workspace                     = true
futures-util.workspace                = true
metrics-exporter-prometheus.workspace = true
rustix.workspace                      = true
secrecy.workspace                     = true
serde.workspace                       = true
serde_json.workspace                  = true
thiserror.workspace                   = true
tokio.workspace                       = true
tokio-util.workspace                  = true
tracing.workspace                     = true
tracing-subscriber.workspace          = true
uuid.workspace                        = true
zbus.workspace                        = true

[dev-dependencies]
ratatoskr-notes-persistence = { workspace = true, features = ["test-support"] }
tempfile.workspace          = true
http-body-util.workspace    = true
serde_json.workspace        = true
sqlx.workspace              = true
# Paused time for the settle window and the rescan of the watcher tests.
tokio                       = { workspace = true, features = ["test-util"] }
tower.workspace             = true
uuid.workspace              = true

[lints]
workspace = true
