# The checks live once, in ratatoskr-workspace's `.github/workflows/reusable-zizmor.yml`. This wrapper
# says when they run, and it is identical in every Ratatoskr repository: `drift.yml` fails when it
# differs anywhere or pins an older revision than the workspace's `main`.
name: zizmor

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  # A pull request only needs its newest run; on `main` a cancelled run would leave a commit with no
  # verdict at all.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    uses: po4yka/ratatoskr-workspace/.github/workflows/reusable-zizmor.yml@75b3ed8cb5f1e0bd638db99126f887b65fa73eb8 # main
